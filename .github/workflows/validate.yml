name: Validate extension
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y scrot
      - name: Real extension browser tests and screenshots
        run: xvfb-run -a -s "-screen 0 1600x1200x24" npm run test:browser
        env:
          CAPTURE_DESKTOP: "1"
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-extension-and-test-evidence
          path: |
            artifacts/
            dist/
